<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oportunidades Idealista</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="container">
    <h1>Oportunidades de arrendamento</h1>

    <div id="fontesContainer" class="fontes-container"></div>

    <div class="toolbar">
      <div class="filters-row">
        <span class="filter-group search-group">
          <label for="searchInput">Buscar:</label>
          <input id="searchInput" class="search-input" type="text" placeholder="palavra-chave no título ou na descrição..." />
        </span>
        <span class="filter-group">
          <label for="fonteFilter">Fonte:</label>
          <select id="fonteFilter"></select>
        </span>
        <span class="filter-group">
          <label for="statusFilter">Filtrar por status de fiador:</label>
          <select id="statusFilter"></select>
        </span>
        <span class="filter-group">
          <label for="tipologiaFilter">Tipologia:</label>
          <select id="tipologiaFilter"></select>
        </span>
        <span class="filter-group">
          <label for="anuncianteFilter">Anunciante:</label>
          <select id="anuncianteFilter"></select>
        </span>
        <span class="filter-group">
          <label for="precoMinFilter">Preço (€):</label>
          <input id="precoMinFilter" class="price-input" type="number" min="0" step="10" placeholder="mín." />
          <span>–</span>
          <input id="precoMaxFilter" class="price-input" type="number" min="0" step="10" placeholder="máx." />
        </span>
        <span class="filter-group">
          <label for="sortOrder">Ordenar por:</label>
          <select id="sortOrder">
            <option value="padrao">Padrão</option>
            <option value="data_desc">Data de atualização (mais recente)</option>
            <option value="data_asc">Data de atualização (mais antiga)</option>
          </select>
        </span>
        <label class="favoritos-only">
          <input id="favoritosOnlyFilter" type="checkbox" />
          Somente favoritos <span id="favoritosCount" class="count-badge"></span>
        </label>
        <label class="ocultos-only">
          <input id="verOcultosFilter" type="checkbox" />
          Ver ocultos <span id="ocultosCount" class="count-badge"></span>
        </label>
        <button id="refreshBtn" type="button">Atualizar</button>
      </div>
    </div>

    <div id="summary" class="summary"></div>
    <div id="results" class="cards"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js"></script>
</body>
</html>
