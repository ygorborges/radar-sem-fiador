<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RadarArrendamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">📡</span>
        <div class="brand-text">
          <span class="brand-name">RadarArrendamento</span>
          <span class="brand-tagline">Encontre arrendamentos sem fiador, filtrados à sua medida</span>
        </div>
      </div>
      <nav class="header-actions">
        <button id="toggleConfigBtn" class="toggle-btn" type="button" aria-expanded="false" aria-controls="configCollapsible">
          <span aria-hidden="true">⚙️</span> Configurações de busca
        </button>
        <button id="toggleFiltersBtn" class="toggle-btn" type="button" aria-expanded="false" aria-controls="filtersCollapsible">
          <span aria-hidden="true">🔎</span> Filtros
        </button>
        <button id="toggleMapBtn" class="toggle-btn" type="button" aria-expanded="false" aria-controls="mapCollapsible">
          <span aria-hidden="true">🗺️</span> Mapa
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="configCollapsible" class="collapsible">
      <div class="collapsible-inner">
        <div id="fontesContainer" class="fontes-container"></div>
      </div>
    </div>

    <div id="filtersCollapsible" class="collapsible">
      <div class="collapsible-inner">
        <div class="toolbar">
          <div class="filters-grid">
            <div class="field field-wide">
              <label for="searchInput">Buscar</label>
              <input id="searchInput" type="text" placeholder="palavra-chave no título ou na descrição..." />
            </div>
            <div class="field">
              <label for="fonteFilter">Fonte</label>
              <select id="fonteFilter"></select>
            </div>
            <div class="field">
              <label for="concelhoFilter">Concelho</label>
              <select id="concelhoFilter"></select>
            </div>
            <div class="field">
              <label for="freguesiaFilter">Freguesia</label>
              <select id="freguesiaFilter"></select>
            </div>
            <div class="field">
              <label for="statusFilter">Status de fiador</label>
              <select id="statusFilter"></select>
            </div>
            <div class="field">
              <label for="tipologiaFilter">Tipologia</label>
              <select id="tipologiaFilter"></select>
            </div>
            <div class="field">
              <label for="anuncianteFilter">Anunciante</label>
              <select id="anuncianteFilter"></select>
            </div>
            <div class="field">
              <label for="precoMinFilter">Preço (€)</label>
              <div class="price-range">
                <input id="precoMinFilter" type="number" min="0" step="10" placeholder="mín." />
                <span class="price-range-sep">–</span>
                <input id="precoMaxFilter" type="number" min="0" step="10" placeholder="máx." />
              </div>
            </div>
            <div class="field">
              <label for="sortOrder">Ordenar por</label>
              <select id="sortOrder">
                <option value="padrao">Padrão</option>
                <option value="data_desc">Atualização (mais recente)</option>
                <option value="data_asc">Atualização (mais antiga)</option>
              </select>
            </div>
          </div>
          <div class="filters-footer">
            <label class="switch-check">
              <input id="favoritosOnlyFilter" type="checkbox" />
              <span>Somente favoritos <span id="favoritosCount" class="count-badge"></span></span>
            </label>
            <label class="switch-check">
              <input id="verOcultosFilter" type="checkbox" />
              <span>Ver ocultos <span id="ocultosCount" class="count-badge"></span></span>
            </label>
            <button id="refreshBtn" class="primary refresh-btn" type="button">↻ Atualizar</button>
          </div>
        </div>
      </div>
    </div>

    <div id="mapCollapsible" class="collapsible">
      <div class="collapsible-inner">
        <div class="toolbar map-panel">
          <div class="map-panel-header">
            <h2 class="panel-title">Mapa dos anúncios filtrados</h2>
            <div class="map-legend">
              <span class="map-legend-item"><span class="map-legend-dot marker"></span> Endereço preciso</span>
              <span class="map-legend-item"><span class="map-legend-dot circle"></span> Região aproximada</span>
            </div>
          </div>
          <div id="mapView" class="map-view"></div>
          <p id="mapNote" class="check-hint"></p>
        </div>
      </div>
    </div>

    <div id="summary" class="summary"></div>
    <div id="results" class="cards"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/static/app.js"></script>
</body>
</html>
