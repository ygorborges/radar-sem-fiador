<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Oportunidades Idealista</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #d1d5db;
      --blue: #2563eb;
      --green: #dcfce7;
      --green-text: #166534;
      --yellow: #fef3c7;
      --yellow-text: #92400e;
      --gray: #e5e7eb;
      --gray-text: #374151;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .toolbar {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    select, button {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font-size: 14px;
    }
    button {
      background: var(--blue);
      color: white;
      border: none;
      cursor: pointer;
      margin-left: 8px;
    }
    .summary {
      margin-bottom: 16px;
      font-weight: bold;
      color: var(--muted);
    }
    .cards {
      display: grid;
      gap: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.03);
    }
    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .match { background: var(--green); color: var(--green-text); }
    .sem { background: #e0f2fe; color: #075985; }
    .ignored { background: var(--yellow); color: var(--yellow-text); }
    .titulo {
      margin: 0 0 8px 0;
      font-size: 22px;
    }
    .meta {
      margin: 6px 0;
      color: var(--muted);
    }
    .descricao {
      margin-top: 12px;
      color: var(--gray-text);
      line-height: 1.5;
    }
    .empty {
      background: var(--panel);
      border: 1px dashed var(--line);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
    }
    a {
      color: var(--blue);
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Oportunidades de arrendamento</h1>

    <div class="toolbar">
      <div>
        <label for="statusFilter">Filtrar por status de fiador:</label>
        <select id="statusFilter"></select>
        <label for="tipologiaFilter" style="margin-left: 12px;">Tipologia:</label>
        <select id="tipologiaFilter"></select>
        <label for="anuncianteFilter" style="margin-left: 12px;">Anunciante:</label>
        <select id="anuncianteFilter"></select>
        <button id="refreshBtn" type="button">Atualizar</button>
      </div>
    </div>

    <div id="summary" class="summary"></div>
    <div id="results" class="cards"></div>
  </div>

  <script>
    const DATA_URL = './data/resultados_idealista.json';
    const resultsEl = document.getElementById('results');
    const summaryEl = document.getElementById('summary');
    const statusFilterEl = document.getElementById('statusFilter');
    const tipologiaFilterEl = document.getElementById('tipologiaFilter');
    const anuncianteFilterEl = document.getElementById('anuncianteFilter');

    function statusClass(status) {
      if (status.includes('CONFIRMADO')) return 'match';
      if (status.includes('SEM MENÇÃO')) return 'sem';
      return 'ignored';
    }

    function loadStatuses(data) {
      const selected = statusFilterEl.value || 'todos';
      const statuses = ['todos', ...new Set(data.map(item => item.status))];
      statusFilterEl.innerHTML = statuses.map(value => {
        const label = value === 'todos' ? 'Todos' : value;
        return `<option value="${value}">${label}</option>`;
      }).join('');
      statusFilterEl.value = statuses.includes(selected) ? selected : 'todos';
    }

    function normalizarTipologia(value) {
      const raw = (value || 'Indefinida').toString().trim();
      const match = raw.match(/t?\d+[a-z]?/i);
      if (!match) return 'Indefinida';
      const clean = match[0].toUpperCase();
      if (/^T\d+[A-Z]?$/.test(clean)) return clean;
      return `T${clean.replace(/[^\d]/g, '')}`;
    }

    function loadTipologias(data) {
      const selected = normalizarTipologia(tipologiaFilterEl.value || 'todas');
      const tipologias = ['todas', ...new Set(data.map(item => normalizarTipologia(item.tipologia || 'Indefinida')))].filter(value => value !== 'Indefinida' || selected === 'Indefinida');
      if (!tipologias.includes('todas')) tipologias.unshift('todas');
      tipologiaFilterEl.innerHTML = tipologias.map(value => {
        const label = value === 'todas' ? 'Todas' : value;
        return `<option value="${value}">${label}</option>`;
      }).join('');
      tipologiaFilterEl.value = tipologias.includes(selected) ? selected : 'todas';
    }

    function loadAnunciantes(data) {
      const selected = anuncianteFilterEl.value || 'todos';
      const tipos = ['todos', ...new Set(data.map(item => item.tipo_anunciante || 'Desconhecido'))];
      anuncianteFilterEl.innerHTML = tipos.map(value => {
        const label = value === 'todos' ? 'Todos' : value;
        return `<option value="${value}">${label}</option>`;
      }).join('');
      anuncianteFilterEl.value = tipos.includes(selected) ? selected : 'todos';
    }

    function render(items) {
      summaryEl.textContent = `${items.length} anúncio(s) encontrado(s)`;

      if (!items.length) {
        resultsEl.innerHTML = '<div class="empty">Nenhum anúncio para este filtro.</div>';
        return;
      }

      resultsEl.innerHTML = items.map(item => `
        <div class="card">
          <div class="badge ${statusClass(item.status)}">${item.status}</div>
          <h2 class="titulo">${item.titulo}</h2>
          <div class="meta"><strong>Tipologia:</strong> ${item.tipologia || 'Indefinida'}</div>
          <div class="meta"><strong>Anunciante:</strong> ${item.tipo_anunciante || 'Desconhecido'}</div>
          <div class="meta"><strong>Preço:</strong> ${item.preco}</div>
          <div class="meta"><strong>Link:</strong> <a href="${item.link}" target="_blank" rel="noreferrer">Abrir anúncio</a></div>
          <div class="meta"><strong>Trecho decisivo:</strong> ${item.trecho_status || 'Sem trecho identificado'}</div>
          <div class="descricao">${item.descricao}</div>
        </div>
      `).join('');
    }

    async function fetchData() {
      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) {
          throw new Error('JSON não encontrado. Primeiro corre o script Python para preencher os dados.');
        }
        const data = await response.json();
        loadStatuses(data);
        loadTipologias(data);
        loadAnunciantes(data);

        const statusSelected = statusFilterEl.value || 'todos';
        const tipologiaSelected = tipologiaFilterEl.value || 'todas';
        const anuncianteSelected = anuncianteFilterEl.value || 'todos';

        let filtered = data;
        if (statusSelected !== 'todos') {
          filtered = filtered.filter(item => item.status === statusSelected);
        }
        if (tipologiaSelected !== 'todas') {
          filtered = filtered.filter(item => normalizarTipologia(item.tipologia || 'Indefinida') === tipologiaSelected);
        }
        if (anuncianteSelected !== 'todos') {
          filtered = filtered.filter(item => (item.tipo_anunciante || 'Desconhecido') === anuncianteSelected);
        }

        render(filtered);
      } catch (error) {
        summaryEl.textContent = 'Erro ao ler o ficheiro JSON';
        resultsEl.innerHTML = `<div class="empty">${error.message}</div>`;
      }
    }

    statusFilterEl.addEventListener('change', fetchData);
    tipologiaFilterEl.addEventListener('change', fetchData);
    anuncianteFilterEl.addEventListener('change', fetchData);
    document.getElementById('refreshBtn').addEventListener('click', fetchData);

    fetchData();
  </script>
</body>
</html>
